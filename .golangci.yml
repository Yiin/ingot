version: "2"

linters:
  default: standard
  settings:
    govet:
      # gotk4's idiom for getting a C pointer from a widget converts
      # Native()'s uintptr to unsafe.Pointer (see internal/layershell).
      # govet's unsafeptr check flags that as misuse; `make vet` disables
      # the same check via `go vet -unsafeptr=false`.
      disable:
        - unsafeptr
    staticcheck:
      # SA1019 flags deprecated API. Every hit in this repo is an API the
      # pinned gotk4 (pkg v0.4.0, generated against GTK 4.22.4) offers no
      # replacement for from Go:
      #
      #   - coreglib.InternObject: how the layer-shell shim gets a
      #     *GtkWindow out of a gotk4 widget. BaseObject, the suggested
      #     replacement, does not expose what the cgo call needs.
      #   - gio.ApplicationFlagsNone: gotk4 v0.4.0 does not generate the
      #     ApplicationFlags.DEFAULTFLAGS constant the deprecation points at.
      #   - gtk.ShortcutsWindow: deprecated for GTK 5, which does not
      #     exist yet; GTK 4 ships no successor widget.
      #   - gtk.Widget.TranslateCoordinates: ComputePoint is the
      #     replacement and gotk4 v0.4.0 does not bind it.
      #
      # Revisit on the next gotk4 bump rather than carrying nolint
      # comments at each of the seven call sites.
      #
      # The ST* exclusions below are golangci-lint's own default set,
      # repeated because naming `checks` at all replaces that default
      # rather than adding to it.
      checks:
        - all
        - -SA1019
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022

# golangci-lint truncates to 50 findings per linter and 3 per identical
# message by default, which silently hid most of this repo's backlog —
# the first full run reported "51 issues" because that was the cap, not
# the count. CI must show everything it is failing on.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
