name: CI

on:
  push:
    branches: [main]
  pull_request:

# ubuntu-latest's own GTK is a dead end for this project, twice over:
# ubuntu-24.04 ships GTK 4.14.5 (gotk4 is generated against 4.22.4, so it
# fails to compile against 4.14 headers) and has no libgtk4-layer-shell-dev
# package at all until ubuntu-25.10. archlinux:latest carries gtk4 4.22.4
# and gtk4-layer-shell 1.3.0 in [extra], so both jobs run inside it instead
# of on the runner's native Ubuntu. Kept to a single container entry, no Go
# version matrix: each cold cgo build of gotk4 costs 4-10 minutes.
jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # gobject-introspection carries gobject-introspection-1.0.pc, which
      # gotk4's core/gerror needs at cgo compile time. gtk4 does not pull
      # it in, so without it every cgo package fails to configure.
      - name: Install dependencies
        run: pacman -Sy --noconfirm --needed base-devel git go gtk4 gtk4-layer-shell gobject-introspection pkgconf golangci-lint

      - uses: actions/checkout@v4

      # The container runs as root while the checkout is owned by the
      # runner's uid, so git refuses the repo as "dubious ownership". That
      # breaks the Makefile's `git describe` and Go's VCS stamping.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve GTK version for the cache key
        id: gtk
        run: echo "version=$(pkg-config --modversion gtk4)" >> "$GITHUB_OUTPUT"

      # actions/setup-go is skipped deliberately: it would fetch its own Go
      # toolchain instead of using the distro package the cgo build was
      # tested against, and this job needs cache control over
      # GOCACHE/GOMODCACHE anyway. Go does not hash C headers
      # (golang/go#24355, still open), so the cache key folds in the GTK
      # version — a cache restored from an older GTK would otherwise be
      # silently reused against the new headers.
      - name: Cache Go build and module caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-${{ hashFiles('go.sum') }}-gtk${{ steps.gtk.outputs.version }}
          restore-keys: |
            go-${{ hashFiles('go.sum') }}-gtk-

      - name: make check
        env:
          GOCACHE: ${{ github.workspace }}/.gocache
          GOMODCACHE: ${{ github.workspace }}/.gomodcache
        run: make check

  integration:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # The evdev half of this project (internal/input) cannot run here:
      # GitHub-hosted runners have no /dev/input/event* device nodes. That
      # is exactly why the double-Shift chord detector is a pure state
      # machine behind an interface (internal/hotkey) — its unit tests
      # cover it without touching a real keyboard, and only the pure-Go
      # `check` job needs to pass for that coverage to count.
      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm --needed base-devel git go gtk4 gtk4-layer-shell gobject-introspection pkgconf \
            sway grim wtype wl-clipboard

      # Arch ships sway with cap_sys_nice=ep. Docker's default bounding set
      # has no CAP_SYS_NICE, so execve fails outright with EPERM
      # ("/usr/bin/sway: Operation not permitted") before sway prints a
      # thing. sway wants that capability only to raise its scheduling
      # priority, which the headless software backend does not need, so
      # stripping the file capability is enough — no extra container
      # privileges required.
      - name: Strip sway's file capabilities
        run: setcap -r /usr/bin/sway

      - uses: actions/checkout@v4

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve GTK version for the cache key
        id: gtk
        run: echo "version=$(pkg-config --modversion gtk4)" >> "$GITHUB_OUTPUT"

      - name: Cache Go build and module caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-${{ hashFiles('go.sum') }}-gtk${{ steps.gtk.outputs.version }}
          restore-keys: |
            go-${{ hashFiles('go.sum') }}-gtk-

      - name: make test-integration
        env:
          GOCACHE: ${{ github.workspace }}/.gocache
          GOMODCACHE: ${{ github.workspace }}/.gomodcache
        run: make test-integration
