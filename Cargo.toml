[package]
name = "copper"
version = "0.1.0"
edition = "2021"
description = "Copper (shadcn's macOS capture app) recreated for Wayland. Unofficial."
license = "MIT"

[dependencies]
gtk4 = { version = "0.10", features = ["v4_10"] }
gtk4-layer-shell = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
